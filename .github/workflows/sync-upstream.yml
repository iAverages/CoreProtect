name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: PlayPro/CoreProtect
  TARGET_BRANCH: master

jobs:
  sync:
    name: Rebase onto upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add upstream remote
        run: git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
      - name: Fetch upstream
        run: git fetch upstream "${TARGET_BRANCH}"
      - name: Rebase fork changes
        shell: bash
        run: |
          mapfile -t commits < <(git rev-list --reverse --no-merges "upstream/${TARGET_BRANCH}..HEAD")
          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No fork commit found to rebase" >&2
            exit 1
          fi
          git switch --detach "upstream/${TARGET_BRANCH}"
          git cherry-pick --no-commit "${commits[@]}"
          git commit -C "${commits[0]}"
      - name: Push updates
        run: git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
